name: Daily Wikipedia Trend Analysis

on:
  schedule:
    # Target: 6am Pacific, but GitHub Actions scheduled runs are best-effort
    # and can fire hours late under load -- observed drift as high as 6+
    # hours in practice. There's no "skip if not 6am" guard: run_pending.py
    # is idempotent (no-ops once caught up), so firing more often than
    # needed just costs a few wasted seconds, while gating on an exact hour
    # risks silently skipping every firing for days if GitHub's scheduler
    # drifts outside that hour, which is exactly what happened.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
    - cron: "0 19 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      trending_date:
        description: >-
          Force-run one specific date (YYYY-MM-DD) instead of the automatic
          pending-date sweep. This is the trending_date you want data for,
          not the feed-fetch date -- the +1 day offset is handled for you.
          Leave blank for normal behavior.
        required: false
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analyzer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TRENDING_DATE: ${{ inputs.trending_date }}
        run: |
          set -o pipefail
          if [ -n "$TRENDING_DATE" ]; then
            FETCH_DATE=$(python3 -c "from datetime import date, timedelta; print((date.fromisoformat('$TRENDING_DATE') + timedelta(days=1)).isoformat())")
            echo "Manual run for trending_date=$TRENDING_DATE (feed fetch date $FETCH_DATE)"
            TARGET_DATE="$FETCH_DATE" python main.py 2>&1 | tee run.log
          else
            python -m scripts.run_pending 2>&1 | tee run.log
          fi

      - name: Upload run log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: run.log
          retention-days: 14

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "The daily Wikipedia trend analysis workflow failed."
            echo ""
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "**Last 150 lines of output:**"
            echo '```'
            tail -n 150 run.log 2>/dev/null || echo "(no log captured — failure happened before the analyzer ran)"
            echo '```'
          } > issue_body.md

          gh issue create \
            --title "Daily run failed $(date -u '+%Y-%m-%d')" \
            --body-file issue_body.md \
            --label "bug" 2>/dev/null || \
          gh issue create \
            --title "Daily run failed $(date -u '+%Y-%m-%d')" \
            --body-file issue_body.md
